apiVersion: v1  
kind: Pod  

metadata:
  name: corso-pod-secret  
  namespace: corso26  

spec:
  containers:
    - name: pod-test-secret 
      image: busybox 
      command: ["sh", "-c", "echo $UTENTELETTO - $PASSWORDLETTA && sleep 3600" ]
      env:
        - name: UTENTELETTO  #nome della variabile creata dentro questo file
          valueFrom:
            secretKeyRef: 
              name: secret-database  #nome della configmap applicata
              key: UTENTE  #nome della chiave nel rispettivo configmap 
        - name: PASSWORDLETTA
          valueFrom:
            secretKeyRef:
              name: secret-database
              key: PASSWORD

