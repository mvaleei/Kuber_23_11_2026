apiVersion: networking.k8s.io/v1   
kind: Ingress   

metadata: 
  name: ingresso-ingress 
  namespace: esponi  

spec:
  ingressClassName: nginx  
  rules:
    - http:
        paths:
          - path: /negozio 
            pathType: Prefix     #/compra  /vendi   /vesi/2 
            backend: 
              service:
                name: corso-negozio  
                port:
                  number: 80
          - path: /tutti 
            pathType: Prefix     #/compra  /vendi   /vesi/2 
            backend: 
              service:
                name: corso-servizio  
                port:
                  number: 80