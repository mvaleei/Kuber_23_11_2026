apiVersion: apps/v1 
kind: Deployment  

metadata:
  name: hpa-deployment
  namespace: scaling  

spec:
  replicas: 3  
  selector:
    matchLabels:
      app: lezione-hpa  

  template:
    metadata:
      labels:
        app: lezione-hpa  
    spec: 
      containers:
        - name: lezione-hpa 
          image: ghostmio/immo2:v2  


          resources: 
            requests:
              memory: "256Mi" 
              cpu: "200m"  
            
            limits:
              memory: "512Mi"
              cpu: "500m"